name: cyberleek-watch

on:
  schedule:
    # alle 5 Minuten (kleinstes von GitHub erlaubtes Intervall; kann leicht verzoegern)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # erlaubt manuelles Starten ueber den "Run workflow"-Button

permissions:
  contents: write         # noetig, um state.txt zurueckzuschreiben

concurrency:
  group: cyberleek-watch  # verhindert, dass sich zwei Laeufe ueberschneiden
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Auf neuen Post pruefen
        env:
          USER_HANDLE: cyberleeeknet
          NTFY_TOPIC: cyberleek-watch-l34z71nrqv
        run: bash ./check.sh

      - name: Zustand speichern
        run: |
          if [ -n "$(git status --porcelain state.txt)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.txt
            git commit -m "Zustand aktualisieren"
            git push
          else
            echo "Kein Zustandswechsel - nichts zu committen."
          fi
